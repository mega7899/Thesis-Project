<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Student Attendance Portal</title>
    <link rel="stylesheet" href="/styles/studentPortal.scss" />
  </head>

  <body>
    <aside class="student-sidebar">
      <h2>Student Menu</h2>

      <nav>
        <button id="attendance-btn">Attendance</button>
        <button id="logout-btn">Logout</button>
      </nav>
    </aside>

    <main class="student-dashboard">
      <h1>Student Attendance</h1>

      <section class="attendance-section">
        <h2>Attendance Today</h2>

        <div class="attendance-card" id="attendance-today"></div>
      </section>

      <section class="attendance-section">
        <h2>Attendance History</h2>

        <label for="history-student">Student (demonstration filtering only)</label>
        <select id="history-student"><option value="">Select a student</option></select>
        <button id="history-refresh" type="button">Refresh History</button>
        <p id="history-status" role="status"></p>
        <div class="attendance-history" id="attendance-history">
          <p>Previous attendance records will appear here.</p>
        </div>
        <button id="history-more" type="button" hidden>Load More</button>
      </section>
    </main>

    <script type="module" src="./src/studentPortal.js"></script>
  </body>
</html>
